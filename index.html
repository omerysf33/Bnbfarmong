<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TONIX Clone</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.app {
    max-width: 420px;
    margin: auto;
    padding: 16px;
}

/* Header */
.header {
    text-align: center;
    font-weight: bold;
    font-size: 20px;
    margin-bottom: 16px;
}

/* Balance cards */
.balance-card {
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.balance-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg,#1e90ff,#00c6ff);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: bold;
}

.balance-amount {
    font-weight: bold;
}

/* Center fan */
.center {
    text-align: center;
    margin: 30px 0;
}

.fan {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at center, #1e90ff, #0a2a4f);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto;
    animation: spin 12s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* MrBeast logo */
.logo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #0bbcd6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: white;
    font-size: 14px;
    animation: counterspin 12s linear infinite;
}

@keyframes counterspin {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
}

/* Amount */
.amount {
    font-size: 26px;
    margin-top: 16px;
    font-weight: bold;
}

.speed {
    font-size: 14px;
    color: #666;
}

/* Buttons */
.buttons {
    display: flex;
    gap: 12px;
    margin-top: 20px;
}

button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 16px;
    background: #4aa3ff;
    color: white;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

/* Bottom menu */
.bottom {
    display: flex;
    justify-content: space-around;
    margin-top: 30px;
    background: #fff;
    border-radius: 16px;
    padding: 10px 0;
}

.bottom div {
    font-size: 13px;
    color: #666;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">TONIX App</div>

    <div class="balance-card">
        <div class="balance-left">
            <div class="icon">T</div>
            <div>
                <div>Balance</div>
                <div class="balance-amount" id="tonBalance">0 TON</div>
            </div>
        </div>
    </div>

    <div class="balance-card">
        <div class="balance-left">
            <div class="icon">M</div>
            <div>
                <div>Balance</div>
                <div class="balance-amount" id="tonixBalance">0 TONIX</div>
            </div>
        </div>
    </div>

    <div class="center">
        <div class="fan">
            <div class="logo">
                MR<br>BEAST
            </div>
        </div>

        <div class="amount" id="mined">0.000000 TON</div>
        <div class="speed">⚡ 0 GH/s</div>

        <div class="buttons">
            <button onclick="claim()">Claim</button>
            <button onclick="boost()">Boost</button>
        </div>
    </div>

    <div class="bottom">
        <div>Wallet</div>
        <div>Friends</div>
        <div><b>Home</b></div>
        <div>Missions</div>
        <div>More</div>
    </div>

</div>

<script>
let mined = 0;
let ton = 0;
let tonix = 0;

function claim() {
    mined += 0.001;
    ton += 0.001;
    tonix += 1;

    document.getElementById("mined").innerText = mined.toFixed(6) + " TON";
    document.getElementById("tonBalance").innerText = ton.toFixed(3) + " TON";
    document.getElementById("tonixBalance").innerText = tonix + " TONIX";
}

function boost() {
    alert("Boost özelliği yakında 👀");
}
</script>

</body>
    </html>
